name: Test and publish containers

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH with an optional prerelease suffix.' >&2
            exit 1
          fi
      - name: Test client
        run: python -m unittest discover -s tests -v
      - name: Validate Compose examples
        env:
          CLOUDFLARE_API_TOKEN: example-not-a-real-token
          IP_URL: https://ip.example.com/ip
        run: |
          docker compose -f examples/docker/compose.client.yaml config --quiet
          docker compose -f examples/docker/compose.server.yaml config --quiet
      - uses: azure/setup-kubectl@v5
        with:
          version: 'v1.36.1'
      - name: Render Kubernetes examples
        run: |
          kubectl kustomize examples/kubernetes/overlays/client-example > /dev/null
          kubectl kustomize examples/kubernetes/overlays/server-example > /dev/null
      - name: Build server
        run: docker build -t ddns-server:test cloudflare-ddns-server
      - name: Test direct and proxied server
        run: python tests/smoke_proxy.py ddns-server:test
  images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [cloudflare-ddns-client, cloudflare-ddns-server]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Normalize registry owner
        shell: bash
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
