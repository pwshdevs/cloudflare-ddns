apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudflare-ddns-client
resources:
  - ../../base/client
  - namespace.yaml
images:
  - name: ghcr.io/pwshdevs/cloudflare-ddns-client
    newTag: edge
configMapGenerator:
  - name: cloudflare-ddns-client
    behavior: replace
    files:
      - records.json
patches:
  - path: settings.yaml
